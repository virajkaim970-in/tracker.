<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Firebase Diagnostic Tool</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; line-height: 1.6; }
  .container { max-width: 600px; margin: 0 auto; }
  h1 { color: #38bdf8; font-size: 24px; }
  button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; margin-bottom: 20px; }
  button:hover { background: #7dd3fc; }
  #log { background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 14px; white-space: pre-wrap; min-height: 200px; border: 1px solid #334155; }
  .pass { color: #4ade80; font-weight: bold; }
  .fail { color: #f87171; font-weight: bold; }
  .info { color: #94a3b8; }
</style>
</head>
<body>

<div class="container">
  <h1>🔍 Leaderboard Diagnostic</h1>
  <p style="color:#94a3b8; margin-bottom: 20px;">This tool will test your internet and Firebase database connection.</p>
  
  <button onclick="runTests()">Run Diagnostics</button>
  
  <div id="log">Click "Run Diagnostics" to start...</div>
</div>

<script>
  // YOUR FIREBASE URL
  const FIREBASE_URL = 'https://studytracker1-e4937-default-rtdb.asia-southeast1.firebasedatabase.app';
  const logEl = document.getElementById('log');

  function log(msg, type = 'info') {
    const span = document.createElement('span');
    span.className = type;
    span.innerHTML = msg + '<br>';
    logEl.appendChild(span);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function clearLog() {
    logEl.innerHTML = '';
  }

  async function runTests() {
    clearLog();
    log('Starting diagnostics...\n');

    // TEST 1: Internet
    log('TEST 1: Checking internet connection...');
    if (!navigator.onLine) {
      log('❌ FAILED: Your device is offline. Turn on Wi-Fi or mobile data.', 'fail');
      return;
    }
    log('✅ PASS: Device is online.\n', 'pass');

    // TEST 2: Read from Firebase
    log('TEST 2: Trying to READ from Firebase...');
    log(`URL: ${FIREBASE_URL}/leaderboard.json\n`, 'info');
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000); // 8 second timeout
      
      const res = await fetch(`${FIREBASE_URL}/leaderboard.json`, { signal: controller.signal });
      clearTimeout(timeoutId);

      if (res.status === 401 || res.status === 403) {
        log('❌ FAILED: Permission Denied.', 'fail');
        log('👉 FIX: Go to Firebase Console -> Realtime Database -> Rules. Set ".read": true and ".write": true, then click Publish.', 'info');
        return;
      }

      if (!res.ok) {
        log(`❌ FAILED: Server returned status code ${res.status}`, 'fail');
        log('👉 FIX: Check if your Firebase URL is typed exactly right.', 'info');
        return;
      }

      const data = await res.json();
      log('✅ PASS: Successfully connected and read data.', 'pass');
      log(`Current data in database: ${JSON.stringify(data)}\n`, 'info');

    } catch (e) {
      if (e.name === 'AbortError') {
        log('❌ FAILED: Connection timed out (took longer than 8 seconds).', 'fail');
        log('👉 FIX: You have a slow internet connection, or your APK/WebView is blocking the request.', 'info');
      } else {
        log(`❌ FAILED: Network error. (${e.message})`, 'fail');
        log('👉 FIX: Check your internet connection or the Firebase URL.', 'info');
      }
      return;
    }

    // TEST 3: Write to Firebase
    log('TEST 3: Trying to WRITE to Firebase...');
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      const testData = { test: true, time: Date.now() };
      const res = await fetch(`${FIREBASE_URL}/leaderboard/diagnostic_test.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(testData),
        signal: controller.signal
      });
      clearTimeout(timeoutId);

      if (res.status === 401 || res.status === 403) {
        log('❌ FAILED: Permission Denied.', 'fail');
        log('👉 FIX: Go to Firebase Console -> Realtime Database -> Rules. Set ".write": true, then click Publish.', 'info');
        return;
      }

      if (!res.ok) {
        log(`❌ FAILED: Could not write data. Status ${res.status}`, 'fail');
        return;
      }

      log('✅ PASS: Successfully wrote data to the database.\n', 'pass');
      log('🎉 SUCCESS! Your database is perfectly configured.', 'pass');
      log('If your app is still stuck on Loading, your APK builder (WebToApp) is blocking internet permissions.', 'info');

      // Cleanup
      await fetch(`${FIREBASE_URL}/leaderboard/diagnostic_test.json`, { method: 'DELETE' });

    } catch (e) {
      log(`❌ FAILED: Could not write data. (${e.message})`, 'fail');
    }
  }
</script>
</body>
</html>
